# sakura — per-tool theme names, sourced by bin/theme-set
# ghostty/tmux/nvim variants live in static files in this dir (ghostty.conf,
# nvim-dark, tmux-dark.sh); dark-only, so no light variant exists. pi and
# claude only take a theme name, so theme-set maps appearance -> name from here.
PI_DARK=sakura
PI_LIGHT=
CLAUDE_DARK=sakura
CLAUDE_LIGHT=
TAGLINE="petals on the morning breeze"
