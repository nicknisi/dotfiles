# gruvbox — per-tool theme names, sourced by bin/theme-set
# ghostty/tmux/nvim variants live in static files in this dir (ghostty.conf,
# nvim-dark, nvim-light, tmux-dark.sh, tmux-light.sh); pi and claude only take
# a theme name, so theme-set maps appearance -> name from here.
PI_DARK=gruvbox-dark
PI_LIGHT=gruvbox-light
CLAUDE_DARK=gruvbox
CLAUDE_LIGHT=gruvbox-light
TAGLINE="warm retro groove"
