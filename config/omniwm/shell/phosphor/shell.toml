# Phosphor bar look (`bar phosphor`): Wayline's layout as a green-screen terminal. Colours still
# come from the theme pack (theme = "dotfiles"); see lib/look.luau and shaders/.
theme = "dotfiles"
leading = ["apple-menu", "app-menu", "omniwm", "workspaces", "scratchpads", "active-window"]
center = []
trailing = ["prairie", "agents", "status", "notifications", "fantastical", "control-center"]

[workspaceBar]
autoHide = false
windowLevel = "normal"
position = "overlappingMenuBar"
height = 40
fullWidth = true
fullWidthNotchMode = "splitAroundNotch"
reserveLayoutSpace = true
transparentBackground = false
backgroundOpacity = 1
barFill = "background"
showItemBackgrounds = true
showAccentHighlights = false
showLabels = true
notificationBadges = "dot"
systemStatsButton = false

# Terminal tabs: letters only, no app icons, which leaves room for the title before the notch.
[widgets.workspaces]
compact = true
indicator = "minimal" # 3pt group edges instead of 6pt; the look draws its own markers

[widgets.active-window]
maxWidth = 150

[island]
root = "notch-island"
displays = "notch"
width = 560
height = 260
fullscreen = "hide"

[barShader]
source = "phosphor-scan.metal"
fps = 0
values = [0.28, 0.05, 0.75, 0]
