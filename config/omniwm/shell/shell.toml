profile = "wayline"

[profiles]

[profiles.celestial]
center = ["active-window", "media"]
leading = ["apple-menu", "app-menu", "omniwm", "workspaces", "scratchpads"]
trailing = ["notifications", "volume", "wifi", "battery-details", "control-center", "system-stats", "clock", "power"]

[profiles.default]
center = ["active-window"]
leading = ["apple-menu", "omniwm", "app-menu", "workspaces", "scratchpads"]
theme = "monolith"
trailing = ["media", "notifications", "volume", "wifi", "battery-details", "control-center", "system-stats", "clock"]

[profiles.default.hiddenBar]
enabled = true

[profiles.default.workspaceBar]
autoHide = false
fullWidthNotchMode = "splitAroundNotch"
height = 40.0
hoverPreviewsEnabled = true
showFloatingWindows = true

[profiles.wayline]
center = []
leading = ["apple-menu", "app-menu", "omniwm", "workspaces", "scratchpads", "active-window"]
theme = "wallpaper"
trailing = ["agents", "status", "system-stats", "notifications", "fantastical", "control-center"]

# The window title follows the workspaces (the space by the notch belongs to the island's wings).
[profiles.wayline.widgets.active-window]
maxWidth = 150

# Dynamic Island around the notch; now playing lives here instead of in the bar.
[profiles.wayline.island]
root = "notch-island"
displays = "notch"
width = 560
height = 260
fullscreen = "hide"

[profiles.wayline.workspaceBar]
autoHide = false
backgroundOpacity = 1.0
fullWidth = true
fullWidthNotchMode = "splitAroundNotch"
inactiveIconOpacity = 0.15000000000000002
notificationBadges = "dot"
position = "overlappingMenuBar"
reserveLayoutSpace = true
showItemBackgrounds = true
solidBlackBackground = false
systemStatsButton = false
transparentBackground = false
windowLevel = "normal"
