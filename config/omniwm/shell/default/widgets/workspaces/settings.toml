[options.indicator]
type = "choice"
title = "Workspace indicator"
default = "pills"
choices = ["pills", "underline", "dots", "numbers", "minimal"]

[options.compact]
type = "boolean"
title = "Compact workspace groups"
default = false

[options.occupiedBackground]
type = "boolean"
title = "Highlight occupied workspaces"
default = false
