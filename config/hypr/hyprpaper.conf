# Block syntax: hyprpaper 0.8+ wants a wallpaper block; the old
# `wallpaper = <monitor>,<path>` one-liner is silently ignored and leaves
# "Monitor eDP-1 has no target: no wp will be created".
#
# path is a symlink that bin/theme repoints on every switch (`theme bg next`
# too), then restarts this daemon: hyprpaper 0.8 has no set-wallpaper IPC.
# Until theme has run once there is no symlink and no wallpaper.
#
# monitor = * covers every output, including the three idle DP ports. An empty
# value is NOT a wildcard here (see c5a524c).
#
# fit_mode = cover crops to fill, so a 16:9 or ultrawide source still fills this
# 16:10 panel without letterboxing.
splash = false

wallpaper {
    monitor = *
    path = ~/.local/state/theme/current/background
    fit_mode = cover
}
