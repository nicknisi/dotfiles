# Block syntax, matching what bin/theme generates. hyprpaper 0.8+ wants a
# wallpaper block; the old `wallpaper = <monitor>,<path>` one-liner is silently
# ignored and leaves "Monitor eDP-1 has no target: no wp will be created".
#
# monitor = * covers every output, including the three idle DP ports. An empty
# value is NOT a wildcard here (see c5a524c).
#
# fit_mode = cover crops to fill, so a 16:9 or ultrawide source still fills this
# 16:10 panel without letterboxing.
splash = false

wallpaper {
    monitor = *
    path = ~/.config/backgrounds/shaded.png
    fit_mode = cover
}
