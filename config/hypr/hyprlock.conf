# Day-one hyprlock config: blurred screenshot, one password field.
# /usr/share/hypr/hyprlock.conf (from the package) is the full sample.

general {
    hide_cursor = true
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
}

input-field {
    monitor =
    size = 20%, 5%
    position = 0, -20
    halign = center
    valign = center
    outline_thickness = 3
    inner_color = rgba(0, 0, 0, 0.0)
    outer_color = rgba(ffffffaa)
    check_color = rgba(00ff99ee)
    fail_color = rgba(ff6633ee)
    font_color = rgb(220, 220, 220)
    fade_on_empty = false
    rounding = 15
    placeholder_text = Password
    fail_text = $PAMFAIL
}
