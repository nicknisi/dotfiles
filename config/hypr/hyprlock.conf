# hyprlock: blurred screenshot, one password field, coloured by the active theme.
# /usr/share/hypr/hyprlock.conf (from the package) is the full sample.
#
# bin/theme renders themes/templates/hyprlock.conf.tpl (the $theme_* variables)
# into the state dir. Run `theme <name>` once on a fresh machine: hyprlock
# refuses to start when a sourced file is missing.
source = ~/.local/state/theme/current/theme/hyprlock.conf

general {
    hide_cursor = true
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
}

input-field {
    monitor =
    size = 20%, 5%
    position = 0, -20
    halign = center
    valign = center
    outline_thickness = 3
    inner_color = $theme_bg
    outer_color = $theme_accent
    check_color = $theme_ok
    fail_color = $theme_fail
    font_color = $theme_fg
    fade_on_empty = false
    rounding = 15
    placeholder_text = Password
    fail_text = $PAMFAIL
}
