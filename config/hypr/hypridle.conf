# Day-one hypridle config: dim at 2.5 min, lock at 5, screen and keyboard off at 5.5,
# suspend at 30. Lock before sleep (lid, power key, hibernate) via logind.
# Note the Lua form for hyprctl dispatch; the old `dpms off` form is a parse
# error on Hyprland 0.56.

# lock_cmd: bin/shell-lock starts the Quickshell lock screen (lock.qml) and
# falls back to hyprlock when it does not report a committed lock within 2 s;
# `|| hyprlock` covers shell-lock itself missing from PATH. shell-lock does
# nothing when a lock already holds the session.
# on_unlock_cmd: Hyprland reports every real unlock (lock-notify). shell-lock
# --unlocked ends any lock instance still running then, such as one a newer
# locker displaced, which would otherwise answer "locked" and make the next
# lock request a no-op.
# inhibit_sleep = 3: hold suspend until the session is locked, so the machine
# never resumes to an unlocked frame. Set explicitly: hypridle's auto mode
# keys off the word "hyprlock" in lock_cmd.
general {
    lock_cmd = shell-lock || hyprlock
    on_unlock_cmd = shell-lock --unlocked
    before_sleep_cmd = loginctl lock-session
    inhibit_sleep = 3
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

listener {
    timeout = 150
    on-timeout = brightnessctl -s set 10
    on-resume = brightnessctl -r
}

listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

listener {
    timeout = 330
    on-timeout = brightnessctl -s -d dell::kbd_backlight set 0; hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'; brightnessctl -r -d dell::kbd_backlight
}

listener {
    timeout = 1800
    on-timeout = systemctl suspend
}
