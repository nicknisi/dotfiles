"$schema" = 'https://starship.rs/config-schema.json'

# Port of config/zsh/.zsh_prompt. Two lines: path + node version on top, prompt
# symbol below. Git status and branch on the right, same glyphs and 256-colors.
add_newline = true
format = "$directory$nodejs$line_break$character"
right_format = "$git_status${custom.git_clean}$git_branch$jobs"

# Active named theme. This file is the source and is never rewritten: bin/theme
# renders it, plus the active pack's palette, to
# ~/.local/state/theme/current/theme/starship.toml, and .zshrc points
# STARSHIP_CONFIG there. Starship has no include directive, so the whole file
# has to be rendered rather than a fragment pulled in.
#
# The [palettes.theme] block at the bottom is only the fallback for a machine
# that has not run `theme` yet; after that the rendered copy wins.
palette = "theme"

[directory]
format = "[$path]($style)"
style = "bold accent"
truncation_length = 0
truncate_to_repo = false
home_symbol = "~"

# node_prompt(): only when there's a package.json or node_modules
[nodejs]
format = " [$symbol $version]($style)"
symbol = ""
style = "green"
detect_extensions = []
detect_files = ["package.json"]
detect_folders = ["node_modules"]

# cyan on success, red on failure
[character]
format = "$symbol "
success_symbol = "[](cyan)"
error_symbol = "[](red)"

# the GIT_STATUS_* glyphs, in the order .zsh_prompt's prepends produced.
# bold lives on each variable: a module-level style = "bold" does not apply.
[git_status]
format = "([$ahead_behind$conflicted$stashed$deleted$renamed$modified$staged$untracked]($style))"
style = ""
ahead = "[ ](bold accent)"
behind = "[ ](bold yellow)"
diverged = "[󰧈 ](bold accent)"
up_to_date = ""
conflicted = "[󰧁 ](bold magenta)"
stashed = "[ ](bold yellow)"
deleted = "[󰮉 ](bold red)"
renamed = "[ ](bold yellow)"
modified = "[ ](bold yellow)"
staged = "[ ](bold green)"
untracked = "[ ](bold red)"

# GIT_STATUS_CLEAN — starship has no clean-tree variable, so it needs a module
[custom.git_clean]
require_repo = true
# .zsh_prompt only fell back to CLEAN when the whole status string was empty,
# so this has to rule out a stash and an ahead/behind marker too.
when = 'test -z "$(git status --porcelain)" && ! git status -sb | head -1 | grep -q "\[" && ! git rev-parse --verify -q refs/stash > /dev/null'
format = "[ ](bold green)"

[git_branch]
format = "[ $branch]($style)"
style = "muted"

# suspended_jobs()
[jobs]
format = " [$symbol]($style)"
symbol = "✱"
style = "yellow"

[palettes.theme]
accent = "#b8b8b6"
red = "#e06b58"
green = "#889889"
yellow = "#b8b5a2"
magenta = "#e48b7a"
cyan = "#d0cac7"
muted = "#555c65"
