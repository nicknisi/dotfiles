# vim:ft=tmux
# tmux display things in 256 colors
# set -g default-terminal "tmux-256color"

# Tell apps inside tmux they're talking to tmux, then layer truecolor on top
# via the standard RGB capability (tmux 3.2+) rather than the legacy Tc flag.
set -g default-terminal "tmux-256color"
set -as terminal-features ',xterm-ghostty:RGB'

# Enable overline (SGR 53) passthrough — lets TUI apps draw 1px top rules
set -as terminal-features ',xterm-ghostty:overline'

# Propagate COLORTERM into panes so TUIs (Claude Code, etc.) detect truecolor.
# tmux drops it by default, which downgrades supports-color to a low color level.
set -ga update-environment "COLORTERM"

# enable italics
set -as terminal-overrides ',xterm*:sitm=\E[3m'

# Extended keys — allows Shift+Enter, Ctrl+Enter, etc. to pass through
# Required for pi (and other TUI apps) to distinguish modified Enter from plain Enter
set -g extended-keys always
set -g extended-keys-format csi-u
set -as terminal-features ',xterm-ghostty:extkeys'

# Forward OSC 8 hyperlinks through to Ghostty — without this, tmux strips the
# escape sequences and links rendered by TUI apps (pi statusline, etc.) show
# as plain text instead of clickable links.
set -as terminal-features ',xterm-ghostty:hyperlinks'

# Forward OSC 9;4 progress bars from panes to Ghostty's tab progress indicator.
set -as terminal-features ',xterm-ghostty:progressbar'

# Synchronized output (DECSET 2026): Ghostty paints each tmux redraw whole, so
# no tearing and no cursor-shader smear while tmux hops the cursor around.
set -as terminal-features ',xterm-ghostty:sync'

# Enable undercurl
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'

# Enable undercurl colors
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# Forward escape sequences wrapped in the tmux DCS envelope to the outer
# terminal — lets snacks.image send kitty graphics through to ghostty.
set -g allow-passthrough on

set -g history-limit 20000

# Attaching scrolls the terminal's existing content into Ghostty's scrollback
# instead of switching to the alternate screen and hiding it.
set -s clear-on-attach off

# Scrollbars appear while scrolling or hovering, then fade (styled in theme.tmux).
setw -g pane-scrollbars auto-hide

# Vim-style hybrid line numbers in copy mode (off when entered with the mouse).
setw -g copy-mode-line-numbers hybrid

# automatically renumber tmux windows
set -g renumber-windows on

# update the status bar every X seconds
set-option -g status-interval 3

######################
#### General Settings ####
######################

 # set the prefix to control-a. This is more convenient than control-b
 # and 'a' is right next to Caps Lock (which I remap to control)
set -g prefix C-a
bind C-a send-prefix
bind-key a send-prefix

set -g set-clipboard on

# Enable mouse support for switching panes/windows. When tmux mouse mode is
# active, Ghostty cannot handle its usual Cmd-click for OSC 8 links itself, so
# open a hyperlink directly when tmux reports one under a left click. Preserve
# the stock select/forward behavior everywhere else.
setw -g mouse on
bind-key -n MouseDown1Pane if-shell -F '#{mouse_hyperlink}' \
  'run-shell -b "if command -v xdg-open >/dev/null 2>&1; then xdg-open #{q:mouse_hyperlink}; else open #{q:mouse_hyperlink}; fi"' \
  'select-pane -t = ; send-keys -M'

# make delay shorter
set -g escape-time 0
# make window/pane index start with 1
set -g base-index 1
setw -g pane-base-index 1
set-option -g focus-events on
set-option -g set-titles on

# set vi mode for copy mode
setw -g mode-keys vi
set -g status-keys vi

# automatically rename windows when an explicit name is not set
set-window-option -g automatic-rename on
# tmux-fleet-chips refreshes custom names in one throttled batch. Keep the last
# name between batches instead of launching a shell on every rename check.
# automatic-rename remains the opt-in flag, so explicit user names stay put.
set-option -g automatic-rename-format '#{window_name}'

# set the default title format
set-option -g set-titles-string "#T - #W"

# disabled activity monitoring
setw -g monitor-activity off
set -g visual-activity off

# Rather than constraining window size to the maximum size of any client
# connected to the *session*, constrain window size to the maximum size of any
# client connected to *that window*. Much more reasonable.
setw -g aggressive-resize on

######################
#### Key Bindings ####
######################

# keep CWD when opening new window
unbind c
bind c new-window -c "#{pane_current_path}"

# tile all windows
unbind =
bind = select-layout tiled

# reload config file
bind r source-file ~/.config/tmux/tmux.conf \; display "Config Reloaded!"

# split window and fix path for tmux 1.9
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# pane movement shortcuts
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -r C-h select-window -t :-
bind -r C-l select-window -t :+

# Resize pane shortcuts
bind -r H resize-pane -L 10
bind -r J resize-pane -D 10
bind -r K resize-pane -U 10
bind -r L resize-pane -R 10

# Modal floating pane: a real pane (extended keys, hyperlinks, images) that
# behaves like a popup. -K hands it every key, -C closes it on an outside click,
# and it closes when its command exits.
set -s command-alias[100] 'float=new-pane -O -K -C -B single -S "fg=#{@thm_sl_accent}"'

# lazygit lives on G so prefix-g keeps tmux's floating-pane move/resize table.
bind-key G float -x 80% -y 80% -X 10% -Y 10% -c "#{pane_current_path}" "LG_CONFIG_FILE=\"\${XDG_CONFIG_HOME:-\$HOME/.config}/lazygit/config.yml,\$HOME/.local/state/theme/current/theme/lazygit.yml\" lazygit"

bind-key y float -x 90% -y 70% -X 5% -Y 15% "fleet"

# jump to next waiting agent pane
bind-key n run-shell "fleet next"

# toggle the status bar
bind-key -T prefix T set-option -g status

# Cheat sheet on demand (built in theme.tmux) instead of on every prefix press.
bind-key ? display-message -d 0 '#{E:@hints}'

# A control-mode client over SSH (the phone) must not shrink windows on the
# desktop to its size; it pans the full-size window instead.
set-hook -g 'client-attached[80]' {
  if-shell -F '#{client_control_mode}' { refresh-client -f ignore-size }
}

unbind s
# bind-key "s" display-popup -E -w 40% "sesh connect \"$(
#  sesh list -i | gum filter --limit 1 --no-sort --fuzzy --placeholder 'Pick a sesh' --height 50 --prompt='⚡'
# )\""

bind s float -x 90% -y 70% -X 5% -Y 15% "tm"

# Window/session tree in a floating pane: -h hides the pane hosting it, -k
# closes that pane when the tree exits (pick, q or Escape).
bind w float -E -x 80% -y 70% -X 10% -Y 15% \; choose-tree -hkw

# more settings to make copy-mode more vim-like
unbind [
bind Escape copy-mode
unbind p
bind p paste-buffer
bind -T copy-mode-vi v send -X begin-selection
# Keep copy mode following new output (an agent still writing); r refreshes once.
bind -T copy-mode-vi R send -X refresh-toggle
bind -T copy-mode-vi y send -X copy-pipe-and-cancel
# Mouse selections copy but stay put in the scrollback; q leaves copy mode.
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-no-clear
bind -T copy-mode-vi DoubleClick1Pane select-pane \; send -X select-word \; send -X copy-pipe-no-clear
bind -T copy-mode-vi TripleClick1Pane select-pane \; send -X select-line \; send -X copy-pipe-no-clear

# Clean up stale agent status files from previous tmux server
run-shell "fleet reconcile >/dev/null 2>&1 &"

# Load local theme plugin. Plain $HOME (tmux config can't parse
# ${VAR:-default}); ~/.config/tmux is the dotfiles symlink on every machine.
run-shell "$HOME/.config/tmux/theme/theme.tmux"

if-shell "[ -z \"$TMUX_MINIMAL\" ]" {
  set -g status on
} {
  set -g status off
  set-hook -g window-created 'if -F "#{e|>:#{session_windows},1}" "set status on"'
  set-hook -g window-closed  'if -F "#{e|<:#{session_windows},2}" "set status off"'
}

# A command that ran 10s+ finished in a window nobody is viewing: ring that
# pane's bell, so the window name turns red until visited (theme.tmux) and
# Ghostty hears it. Needs the OSC 133 marks set up in config/zsh/.zshrc.
set-hook -g 'pane-command-finished[80]' {
  if-shell -F '#{&&:#{e|>=:#{hook_command_duration},10},#{==:#{window_active_clients},0}}' {
    run-shell -b 'printf "\\a" > #{q:pane_tty}'
  }
}


# Fleet's chips live on the right of the single status row (theme.tmux), so
# fleet must not claim a second row or put │ between chips. Both options are
# read by fleet's inject (>= the release after 0.25.0) and ignored by older
# builds, which is what the `set -g status on` fallback below is for.
set -g @fleet_statusline_row none
set -g @fleet_chip_separator none
run-shell "fleet statusline --inject" # fleet-managed
# `fleet sidebar` toggles the split instead of stacking a new one each press.
# --from is required: a run-shell child inherits the tmux *server's* TMUX_PANE,
# so without it the toggle lands in whichever window started the server.
bind-key f run-shell "fleet sidebar --from '#{pane_id}'" # fleet-managed

# One row. Older fleet builds ignore @fleet_statusline_row and turn on a second
# status row in the inject above; switch it back off here. Harmless once fleet
# honours the option — this must sit below fleet's inject line either way.
set -g status on

# Clicks on the status line. User ranges arrive as MouseDown1Status with the
# range name in #{mouse_status_range}; fleet's inject binds this key for its
# chips, so this rebinding (below it on purpose) keeps fleet's command and adds
# ours in front: a range named sess-<name> — the other sessions' labels
# theme.tmux draws at the right — switches to that session; a click on the
# window list selects the window; any other range is one of fleet's chips.
bind-key -n MouseDown1Status if-shell -F '#{m:sess-*,#{mouse_status_range}}' {
  run-shell 'tmux switch-client -t "=#{s/^sess-//:mouse_status_range}"'
} {
  if-shell -F '#{||:#{==:#{mouse_status_range},window},#{==:#{mouse_status_range},}}' {
    select-window -t=
  } {
    run-shell 'fleet switch "#{mouse_status_range}" --from "#{pane_id}"'
  }
}
# Right-click on a fleet chip acknowledges it in place. Fleet's own binding for
# this only fires on status row 1; the chips live on row 0 here.
bind-key -n MouseDown3Status if-shell -F '#{&&:#{!=:#{mouse_status_range},},#{!=:#{mouse_status_range},window}}' {
  run-shell 'fleet ack "#{mouse_status_range}" --from "#{pane_id}"'
}
# Clicking your own session label opens tm, like prefix-s.
bind-key -n MouseDown1StatusLeft float -x 90% -y 70% -X 5% -Y 15% "tm"
