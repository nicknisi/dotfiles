# Log nicknisi in on tty1 at boot so config/zsh/.zprofile can start Hyprland
# through uwsm with no display manager. Declared in [bootstrap.files] in
# config/mise/config.toml.
[Unit]
# The LUKS passphrase is the only gate before the desktop, so tty1 runs only
# when the kernel was asked to unlock a disk (cryptdevice= for the encrypt
# hook, rd.luks.* for sd-encrypt). Anywhere else tty1 gets no getty at all, and
# Ctrl+Alt+F2 is the way in. An sd-encrypt setup that only uses
# /etc/crypttab.initramfs lands there too.
ConditionKernelCommandLine=|cryptdevice
ConditionKernelCommandLine=|rd.luks.name
ConditionKernelCommandLine=|rd.luks.uuid

[Service]
# Autologin on the first start of each boot only; every restart after that
# (Restart=always: a compositor crash, a logout) asks for the password. See
# /usr/local/lib/tty1-getty, from config/mise/files.
ExecStart=
ExecStart=-/usr/local/lib/tty1-getty ${TERM}
# getty@ waits up to 5 s for boot jobs to finish so their messages don't print
# over the prompt. A quiet boot prints nothing, so skip the wait.
Type=simple
