[tools]
# languages / runtimes
node = "24"
python = "3.14.7"
pnpm = "latest"
bun = "latest"
deno = "latest"
lua = "latest"
tree-sitter = "latest"

# clis
1password-cli = "latest"
claude-code = "latest"
codex = "latest"
pi = "latest"

# npm packages
"npm:@earendil-works/pi-coding-agent" = "latest"
"npm:wrangler" = "latest"
"npm:greptile" = "latest"
"npm:workos" = "latest"

# dev tools
bat = "latest"
delta = "latest"
eza = "latest"
fd = "latest"
fzf = "latest"
github-cli = "latest"
glow = "latest"
gum = "latest"
jq = "latest"
lazygit = "latest"
neovim = "latest"
ripgrep = "latest"
shellcheck = "latest"
starship = "latest"
stylua = "latest"
tmux = "latest"
zoxide = "latest"
superfile = "latest"

# git
"github:nicknisi/diffdad" = "latest"
"github:nicknisi/fleet" = "latest"
"github:nicknisi/tm" = "latest"
"github:nicknisi/sessions" = "latest"

[bootstrap.packages]
# core utilities newer than what macOS ships
"brew:bash" = { version = "latest", os = "macos" }
"brew:git" = { version = "latest", os = "macos" }        # mise has no git backend, this is the only source
"brew:zsh" = { version = "latest", os = "macos" }        # newer than system /bin/zsh; see [bootstrap.user]
"brew:grep" = { version = "latest", os = "macos" }
"brew:vim" = { version = "latest", os = "macos" }

# no mise backend: linux-only builds, perl scripts, or source-only releases
"brew:btop" = { version = "latest", os = "macos" }       # a top alternative (aqua:btop is linux-only)
"brew:cloc" = { version = "latest", os = "macos" }       # lines of code counter
"brew:entr" = { version = "latest", os = "macos" }       # file watcher / command runner
"brew:fswatch" = { version = "latest", os = "macos" }    # fs event watcher (pushes fleet state to sketchybar)
"brew:gnupg" = { version = "latest", os = "macos" }      # GPG
"brew:highlight" = { version = "latest", os = "macos" }  # code syntax highlighting
"brew:tree" = { version = "latest", os = "macos" }       # pretty-print directory contents
"brew:wdiff" = { version = "latest", os = "macos" }      # word differences in text files
"brew:wget" = { version = "latest", os = "macos" }       # internet file retriever

# Ubuntu devcontainer
"apt:bash" = { version = "latest", os = "linux" }
"apt:git" = { version = "latest", os = "linux" }
"apt:zsh" = { version = "latest", os = "linux" }
"apt:grep" = { version = "latest", os = "linux" }
"apt:vim" = { version = "latest", os = "linux" }
"apt:btop" = { version = "latest", os = "linux" }
"apt:cloc" = { version = "latest", os = "linux" }
"apt:entr" = { version = "latest", os = "linux" }
"apt:fswatch" = { version = "latest", os = "linux" }
"apt:gnupg" = { version = "latest", os = "linux" }
"apt:highlight" = { version = "latest", os = "linux" }
"apt:libreadline-dev" = { version = "latest", os = "linux" }
"apt:pkg-config" = { version = "latest", os = "linux" }
"apt:tree" = { version = "latest", os = "linux" }
"apt:wdiff" = { version = "latest", os = "linux" }
"apt:wget" = { version = "latest", os = "linux" }

"pacman:zsh" = { version = "latest", os = "linux" }
"pacman:vim" = { version = "latest", os = "linux" }
"pacman:btop" = { version = "latest", os = "linux" }
"pacman:cloc" = { version = "latest", os = "linux" }

# macOS only
"brew:noti" = { os = "macos" }                      # notifications from scripts
"brew:trash" = { os = "macos" }                     # rm, but to the trash
"brew-cask:ghostty" = { os = "macos" }
"brew-cask:wezterm" = { os = "macos" }
"brew-cask:karabiner-elements" = { os = "macos" }
"brew-cask:font-symbols-only-nerd-font" = { os = "macos" }
"brew-cask:font-monaspace" = { os = "macos" }

[bootstrap.repos]
"~/Developer/pi-extensions" = { url = "git@github.com:nicknisi/pi-extensions.git" }
"~/Developer/ideation" = { url = "git@github.com:nicknisi/ideation.git" }
"~/Developer/claude-plugins" = { url = "git@github.com:nicknisi/claude-plugins.git" }

# Login shell. /bin/zsh works on both platforms: macOS ships zsh there, and
# on Arch /bin is a symlink to /usr/bin. Mise appends it to /etc/shells if
# missing, then runs chsh (mise bootstrap user apply). Absolute path required.
[bootstrap.user]
login_shell = "/bin/zsh"

# macOS preferences.
[bootstrap.macos.finder]
show_all_files = false
show_pathbar = true
show_status_bar = true

[bootstrap.macos.keyboard]
key_repeat = 1
initial_key_repeat = 15
press_and_hold = false

[bootstrap.macos.trackpad]
tap_to_click = true

[bootstrap.macos.defaults]
NSGlobalDomain = { AppleShowAllExtensions = true, NSNavPanelExpandedStateForSaveMode = true, AppleKeyboardUIMode = 3, AppleFontSmoothing = 2, NSWindowShouldDragOnGesture = true }
"com.apple.finder" = { FXDefaultSearchScope = "SCcf" }

# Defaults don't take effect until the app restarts, and these two aren't
# `defaults` at all: an array value mise can't write, and a file flag.
[bootstrap.hooks.post-defaults]
run = """
  if [ "$(uname)" = "Darwin" ]; then
    chflags nohidden ~/Library
    for app in Safari Finder Dock Mail SystemUIServer; do killall "$app" 2>/dev/null || true; done
  fi
"""

# These taps do not publish the API metadata required by mise's brew manager.
[bootstrap.hooks.pre-packages]
run = """
  if [ "$(uname)" = "Darwin" ]; then
    mise run install-tap-packages
  fi
"""

[tasks.install-homebrew]
description = "Install homebrew onto the system."
run = """
  if command -v brew >/dev/null 2>&1; then
    echo "homebrew already installed at $(brew --prefix)"
    exit 0
  fi
  /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
"""

[tasks.install-tap-packages]
description = "Install macOS packages that mise cannot resolve."
depends = ["install-homebrew"]
run = """
  export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"

  brew trust 'FelixKratz/formulae'
  brew trust 'nikitabobko/tap'
  brew tap 'FelixKratz/formulae'
  brew tap 'nikitabobko/tap'

  brew install borders sketchybar
  brew install --cask nikitabobko/tap/aerospace
  brew services start borders
"""

# `mise bootstrap` runs this after [tools] are installed.
[tasks.bootstrap]
description = "Register repo-local Git filters."
run = """
  # DOTFILES_DIR/DOTFILES come from zshenv; fall back per-OS when absent
  # (e.g. bootstrap running under bash before zsh is set up)
  if [[ "$(uname -s)" == "Linux" ]]; then
    repo="${DOTFILES_DIR:-${DOTFILES:-$HOME/code/dotfiles}}"
  else
    repo="${DOTFILES_DIR:-${DOTFILES:-$HOME/Developer/dotfiles}}"
  fi

  echo "==> git filters"
  git -C "$repo" config filter.pi-settings.clean "jq 'del(.lastChangelogVersion)'"
  git -C "$repo" config filter.pi-settings.required false
"""

[tasks.setup-git]
description = "Configure the local Git identity for this machine."
run = """
  default_name="$(git config --global --includes --get user.name || true)"
  default_email="$(git config --global --includes --get user.email || true)"
  default_github="$(git config --global --includes --get github.user || true)"

  printf "Name [%s]: " "$default_name"
  IFS= read -r name
  printf "Email [%s]: " "$default_email"
  IFS= read -r email
  printf "GitHub username [%s]: " "$default_github"
  IFS= read -r github

  name="${name:-$default_name}"
  email="${email:-$default_email}"
  github="${github:-$default_github}"
  if [ -z "$name" ] || [ -z "$email" ] || [ -z "$github" ]; then
    echo "Name, email, and GitHub username are required." >&2
    exit 1
  fi

  git config --file "$HOME/.gitconfig-local" user.name "$name"
  git config --file "$HOME/.gitconfig-local" user.email "$email"
  git config --file "$HOME/.gitconfig-local" github.user "$github"
  echo "Wrote $HOME/.gitconfig-local"
"""

[tasks."update:system"]
description = "Update Homebrew packages."
run = "brew update && brew upgrade"

[tasks."update:tools"]
description = "Update mise, managed tools, uv tools, and Pi extensions."
run = """
  echo "==> mise"
  # self-update only applies to the standalone installer, not a brew install
  case "$(command -v mise)" in */homebrew/*) ;; *) mise self-update -y ;; esac
  mise upgrade

  echo "==> uv"
  command -v uv >/dev/null 2>&1 && uv tool upgrade --all

  echo "==> pi extensions"
  pi update --extensions
"""

[tasks."update:plugins"]
description = "Update Neovim and zsh plugins."
run = """
  echo "==> neovim"
  nvim --headless '+Lazy! sync' +qa

  echo "==> zsh plugins"
  # zfetch's plugin map is built by .zshrc, so read it from an interactive zsh
  zsh -ic 'for k in ${(k)plugins}; do echo "$plugins[$k]"; done' |
  while read -r dir; do
    git -C "$dir" pull --quiet --recurse-submodules && echo "  $(basename "$dir")"
  done
"""

[tasks."update:dotfiles"]
description = "Fast-forward this repository when it is on main."
run = """
  # global config, so MISE_PROJECT_ROOT is wherever you're standing
  # DOTFILES_DIR/DOTFILES come from zshenv; fall back per-OS when absent
  if [[ "$(uname -s)" == "Linux" ]]; then
    repo="${DOTFILES_DIR:-${DOTFILES:-$HOME/code/dotfiles}}"
  else
    repo="${DOTFILES_DIR:-${DOTFILES:-$HOME/Developer/dotfiles}}"
  fi
  if [ "$(git -C "$repo" symbolic-ref --short HEAD)" = "main" ]; then
    git -C "$repo" pull --ff-only origin main
  else
    echo "not on main, skipping"
  fi
"""

[tasks."update:all"]
description = "Update system packages, tools, plugins, and this repository."
run = [
  { task = "update:system" },
  { task = "update:tools" },
  { task = "update:plugins" },
  { task = "update:dotfiles" },
]

# [dotfiles] lives in the repo-root mise.toml, NOT here: its sources are
# relative to the declaring file's directory, so from the global config they'd
# resolve against ~/.config (through the ~/.config/mise symlink) instead of the
# repo. From the repo-root mise.toml they resolve against the clone itself,
# wherever it lives. Run dotfiles commands from inside the repo:
#   mise bootstrap dotfiles status|diff|apply

[settings]
idiomatic_version_file_enable_tools = ["node"]
minimum_release_age_excludes = [
  "npm:@earendil-works/pi-coding-agent",
  "github:nicknisi/diffdad",
  "github:nicknisi/fleet",
  "github:nicknisi/tm",
  "github:nicknisi/sessions",
  "claude-code",
]
